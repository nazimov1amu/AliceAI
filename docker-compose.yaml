services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 8000:8000
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      - redis
  redis:
    image: redis:8
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
volumes:
  redis_data: