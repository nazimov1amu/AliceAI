[project]
name = "alice-ai"
version = "0.1.0"
description = "AliceAI API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "starlette",
    "pydantic>=2.13.5",
    "langchain>=1.3.18",
    "langchain-openai>=1.6.0",
    "loguru>=0.7.3",
    "langgraph-checkpoint-redis>=0.5.2",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "asgi-lifespan",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
